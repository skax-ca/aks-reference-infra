# live/dev/workbench: plan → (사람이 그 run의 요약을 읽고 승인) → apply
#
# deploy-hub-workbench.yml과 같은 구조(plan은 push에서 자동, apply는 environment 승인 뒤)다.
# dev 구독, dev CI 신원(environment: dev)을 쓴다. FIC subject 패턴은 bootstrap이
# gha-dev-main(ref:refs/heads/main)·gha-dev-environment(environment:dev)로 만든다.
#
# ⛔ plan job에 `environment:`를 추가하지 않는다. FIC subject의 ref:refs/heads/main /
#    environment:dev 대응이 어긋난다(근거는 deploy-hub-network.yml).
# ⛔ apply를 `tofu apply`(재-plan)로 바꾸지 않는다.
#
# ⚠️ 이 root는 apply 전에 사람이 끝내야 하는 사전조건 2가지가 있다:
#    1. GitHub repo 변수 AZURE_DEV_WORKBENCH_SSH_CIDRS·AZURE_DEV_WORKBENCH_ADMIN_OBJECT_ID
#    2. live/dev/workbench/workbench_ed25519.pub 커밋(SSH 공개키. private key는 git 밖)

name: deploy · live/dev/workbench

on:
  push:
    branches: [main]
    paths:
      - live/dev/workbench/**
      - .github/workflows/deploy-dev-workbench.yml
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기 / plan = 확인만(적용하지 않는다)"
        type: choice
        options: [apply, destroy, plan]
        default: apply
      confirm:
        description: "destroy일 때만 필수. 정확히 `destroy live/dev/workbench`를 입력한다"
        type: string
        default: ""

# state는 단일 자원이다. cancel-in-progress는 false여야 한다.
concurrency:
  group: live-dev-workbench
  cancel-in-progress: false

env:
  TF_ROOT: live/dev/workbench
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "false"
  ARM_CLIENT_ID: ${{ vars.AZURE_DEV_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_DEV_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_subscription_id: ${{ vars.AZURE_DEV_SUBSCRIPTION_ID }}
  TF_VAR_ci_run: "true"
  TF_VAR_ssh_ingress_cidrs: ${{ vars.AZURE_DEV_WORKBENCH_SSH_CIDRS }}
  TF_VAR_admin_login_principal_id: ${{ vars.AZURE_DEV_WORKBENCH_ADMIN_OBJECT_ID }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # plan: main push와 dispatch 양쪽에서 돈다. environment를 선언하지 않는다.
  # ──────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      # apply 가드가 읽는다. plan 스텝이 -detailed-exitcode 로 판정한 값이다.
      changes: ${{ steps.plan.outputs.changes }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/dev/workbench" ]; then
            echo "::error::destroy 하려면 confirm에 정확히 'destroy live/dev/workbench'를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다: live/dev/workbench"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ tofu_wrapper: false 다. 기본값 true 는 tofu 호출을 래퍼로 감싸 stdout·stderr·exitcode 를
      #    스텝 출력으로 내보내는데, 그 과정에서 -detailed-exitcode 의 2 가 스텝 종료 코드로
      #    전달되지 않는다. 아래 plan 스텝이 code=0 으로 읽어 changes=false 를 내보내고, 변경이
      #    있어도 apply 가 skipped 로 끝난다. 액션 문서도 exit code 가 이상하면 이 값을 false 로
      #    두라고 적는다. verify.yml 이 같은 값을 쓴다.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        # 값의 SSOT 는 커밋된 backend.hcl.example 이다. 여기서 다시 적지 않는다 — key 가 두 곳에
        # 있으면 한쪽만 고쳤을 때 다른 root 의 state 를 덮어쓴다. git 밖 값인 Storage Account
        # 이름만 치환한다.
        # ⛔ 조립한 backend.hcl 을 출력하지 않는다. vars 는 secrets 와 달리 로그에서 마스킹되지
        #    않고, 이 저장소는 public 이라 Actions 로그가 공개된다.
        run: |
          sed 's|^storage_account_name .*|storage_account_name = "${{ vars.DEV_TF_STATE_ACCOUNT }}"|' \
            backend.hcl.example > backend.hcl
          if grep -q 'XXXXXXXX' backend.hcl; then
            echo "::error::backend.hcl 치환 실패. backend.hcl.example 의 storage_account_name 줄을 확인한다"
            exit 1
          fi

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          set +e
          tofu plan $DESTROY -no-color -input=false -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\`: live/dev/workbench"
              echo
              echo "> **파기 계획이다.** 이 run의 apply를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\`: live/dev/workbench"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            if [ "${{ inputs.action }}" = "plan" ]; then
              echo
              echo "> 확인 전용 실행이다(\`action=plan\`). 변경이 있어도 apply 하지 않는다."
            fi
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> dev 구독이다. 이 목록은 승인 전에 사람이 읽는다."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: plan artifact 업로드
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 7
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # apply: plan 뒤 environment 승인을 기다린다. push·dispatch 모두 같은 경로다.
  # ──────────────────────────────────────────────────────────────────────────
  apply:
    name: apply
    needs: plan
    # 승인 게이트는 environment의 required reviewers다. push든 dispatch든 plan 뒤에 멈춘다.
    # ⚠️ 브랜치 조건: workflow_dispatch는 임의 브랜치에서 눌릴 수 있다. Environment의 deployment
    #    branch policy(main 하나)가 최종 방어선이지만, job 조건으로도 막아 두면 실패가 아니라
    #    skip으로 끝난다.
    # ⚠️ changes 가드: 변경 0건이면 apply 를 건너뛴다. 빈 승인 클릭을 없애고, 승인 게이트가
    #    섰다는 사실 자체를 "적용할 것이 있다"는 신호로 만든다. destroy 는 항상 changes=true 다.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.plan.outputs.changes == 'true'
      && inputs.action != 'plan'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ tofu_wrapper: false 다(plan job 과 같은 근거). 이 job 의 apply 후 수렴 검증도
      #    -detailed-exitcode 로 판정하므로, 래퍼가 켜져 있으면 미수렴을 잡지 못한다.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        # 값의 SSOT 는 커밋된 backend.hcl.example 이다. 여기서 다시 적지 않는다 — key 가 두 곳에
        # 있으면 한쪽만 고쳤을 때 다른 root 의 state 를 덮어쓴다. git 밖 값인 Storage Account
        # 이름만 치환한다.
        # ⛔ 조립한 backend.hcl 을 출력하지 않는다. vars 는 secrets 와 달리 로그에서 마스킹되지
        #    않고, 이 저장소는 public 이라 Actions 로그가 공개된다.
        run: |
          sed 's|^storage_account_name .*|storage_account_name = "${{ vars.DEV_TF_STATE_ACCOUNT }}"|' \
            backend.hcl.example > backend.hcl
          if grep -q 'XXXXXXXX' backend.hcl; then
            echo "::error::backend.hcl 치환 실패. backend.hcl.example 의 storage_account_name 줄을 확인한다"
            exit 1
          fi

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: plan artifact 내려받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      - name: apply 후 수렴 검증 (읽기 전용 재-plan)
        working-directory: ${{ env.TF_ROOT }}
        run: |
          DESTROY=""
          [ "${{ inputs.action }}" = "destroy" ] && DESTROY="-destroy"

          set +e
          tofu plan $DESTROY -no-color -input=false -lock-timeout=5m -detailed-exitcode -refresh=true
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::error::apply 직후인데 재-plan이 여전히 변경사항을 보고한다. 일부 리소스가 반영되지 않았을 가능성이 높다. Azure 포털/CLI로 실물을 직접 대조할 것."
            exit 1
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\`: live/dev/workbench"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\`의 artifact \`tfplan-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
