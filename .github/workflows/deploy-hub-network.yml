# live/hub/networking: plan → (사람이 그 run의 요약을 읽고 승인) → apply
#
# AWS 원본(skax-ca/eks-reference-infra의 deploy-hub-network.yml)과 같은 구조다. plan은
# push에서 자동으로 돌고, apply는 environment의 required reviewers 승인 뒤 같은 run에서 돈다.
# 승인자는 그 run의 plan 요약을 읽고 누른다. dispatch는 destroy·replace와 재-plan 경로다.
#
# ⚠️ **AWS 원본과 인증 구조가 다르다.** 원본은 OIDC 2단 Role 체인(입구 Role → 실행 Role)이라
#    provider와 backend 양쪽에 assume_role을 배선했다. 이 repo의 CI 신원은 그 체인 없이 구독
#    권한을 직접 가지므로 ARM_* 환경변수 4개만 설정하면 azurerm provider와 backend 양쪽이
#    같은 OIDC 토큰으로 인증된다.
#
# ⛔ plan job에 `environment:`를 추가하지 않는다. environment를 선언한 job만 OIDC sub에
#    `:environment:<name>`을 받는다. bootstrap의 FIC subject 패턴(SUB_MAIN은 ref:refs/heads/main,
#    SUB_ENV는 environment:hub)과 정확히 대응해야 한다(bootstrap/config.sh 참고).
#
# ⛔ apply를 `tofu apply`(재-plan)로 바꾸지 않는다. 승인한 계획과 다른 것을 적용하게 된다.

name: deploy · live/hub/networking

on:
  push:
    branches: [main]
    paths:
      - live/hub/networking/**
      - .github/workflows/deploy-hub-network.yml
  workflow_dispatch:
    inputs:
      action:
        description: "apply = 생성·수정 / destroy = 파기 / plan = 확인만(적용하지 않는다)"
        type: choice
        options: [apply, destroy, plan]
        default: apply
      confirm:
        description: "destroy일 때만 필수. 정확히 `destroy live/hub/networking`를 입력한다"
        type: string
        default: ""

# state는 단일 자원이다. cancel-in-progress는 false여야 한다. apply 중인 run을 취소하면
# state와 실제가 갈라진다.
concurrency:
  group: live-hub-networking
  cancel-in-progress: false

env:
  TF_ROOT: live/hub/networking
  TOFU_VERSION: 1.12.5
  TF_IN_AUTOMATION: "1"
  # ⚠️ TF_IN_AUTOMATION만으로는 입력 프롬프트를 막지 못한다(안내 문구만 바뀐다). 값 없는
  # 필수 변수(예: TF_VAR_subscription_id 누락)를 만나면 stdin이 비대화형이어도 EOF를 기다리며
  # 멈춘다. TF_INPUT=false로 프롬프트를 차단해 "값이 없다"를 즉시 에러로 드러낸다.
  TF_INPUT: "false"
  # ⚠️ 이 repo는 Azure 신원을 2개(hub·dev) 다루므로 AZURE_CLIENT_ID·
  # AZURE_SUBSCRIPTION_ID 대신 AZURE_HUB_*를 쓴다. AZURE_TENANT_ID는 두 구독이 같은
  # 테넌트라 공유한다.
  ARM_CLIENT_ID: ${{ vars.AZURE_HUB_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_HUB_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  # provider "azurerm" { subscription_id = var.subscription_id }가 소비한다. ARM_*는
  # provider 자동 인증에만 쓰이고 이 변수엔 자동 연결되지 않는다.
  TF_VAR_subscription_id: ${{ vars.AZURE_HUB_SUBSCRIPTION_ID }}
  # providers.tf의 require_oidc_guard가 "CI에서 왔는가"를 판단하는 유일한 신호. 로컬
  # az login 경로는 이 값을 절대 설정하지 않는다.
  TF_VAR_ci_run: "true"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # plan: main push와 dispatch 양쪽에서 돈다. environment를 선언하지 않는다.
  # ──────────────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      # apply 가드가 읽는다. plan 스텝이 -detailed-exitcode 로 판정한 값이다.
      changes: ${{ steps.plan.outputs.changes }}
    permissions:
      id-token: write # OIDC JWT 발급. ARM_USE_OIDC=true가 이 토큰을 쓴다
      contents: read

    steps:
      - name: destroy 확인
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "destroy live/hub/networking" ]; then
            echo "::error::destroy 하려면 confirm에 정확히 'destroy live/hub/networking'를 입력한다."
            exit 1
          fi
          echo "::warning::destroy 계획을 세운다: live/hub/networking"

      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # ── partial backend configuration ────────────────────────────────────
      # Storage Account명이 코드에 없다. repo 변수로 조립한다. azurerm backend는
      # provider와 같은 ARM_* 환경변수로 OIDC 인증하므로(AWS의 assume_role 같은
      # 별도 배선이 필요 없다) 여기 인증 블록을 추가하지 않는다.
      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        # 값의 SSOT 는 커밋된 backend.hcl.example 이다. 여기서 다시 적지 않는다 — key 가 두 곳에
        # 있으면 한쪽만 고쳤을 때 다른 root 의 state 를 덮어쓴다. git 밖 값인 Storage Account
        # 이름만 치환한다.
        # ⛔ 조립한 backend.hcl 을 출력하지 않는다. vars 는 secrets 와 달리 로그에서 마스킹되지
        #    않고, 이 저장소는 public 이라 Actions 로그가 공개된다.
        run: |
          sed 's|^storage_account_name .*|storage_account_name = "${{ vars.HUB_TF_STATE_ACCOUNT }}"|' \
            backend.hcl.example > backend.hcl
          if grep -q 'XXXXXXXX' backend.hcl; then
            echo "::error::backend.hcl 치환 실패. backend.hcl.example 의 storage_account_name 줄을 확인한다"
            exit 1
          fi

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: tofu plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then
            DESTROY="-destroy"
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

          set +e
          tofu plan $DESTROY -no-color -input=false -lock-timeout=5m -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: plan 요약 작성
        id: summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          tofu show -no-color tfplan > plan.txt
          {
            if [ "${{ steps.plan.outputs.destroy }}" = "true" ]; then
              echo "### 🔴 \`tofu plan -destroy\`: live/hub/networking"
              echo
              echo "> **파기 계획이다.** 이 run의 apply를 승인하면 아래 목록이 전부 사라진다."
            else
              echo "### \`tofu plan\`: live/hub/networking"
            fi
            echo
            echo "변경 있음: **${{ steps.plan.outputs.changes }}**"
            if [ "${{ inputs.action }}" = "plan" ]; then
              echo
              echo "> 확인 전용 실행이다(\`action=plan\`). 변경이 있어도 apply 하지 않는다."
            fi
            echo
            echo "#### ⚠️ destroy / replace 대상"
            echo "> hub 구독이다. 이 목록은 승인 전에 사람이 읽는다."
            echo
            echo '```'
            grep -E 'will be destroyed|must be replaced|will be replaced' plan.txt || echo '(없음)'
            echo '```'
            echo
            echo "<details><summary>plan 전문 (앞 50KB)</summary>"
            echo
            echo '```hcl'
            head -c 50000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: plan artifact 업로드
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 7
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # apply: plan 뒤 environment 승인을 기다린다. push·dispatch 모두 같은 경로다.
  # ──────────────────────────────────────────────────────────────────────────
  apply:
    name: apply
    needs: plan
    # 승인 게이트는 environment의 required reviewers다. push든 dispatch든 plan 뒤에 멈춘다.
    # ⚠️ 브랜치 조건: workflow_dispatch는 임의 브랜치에서 눌릴 수 있다. Environment의 deployment
    #    branch policy(main 하나)가 최종 방어선이지만, job 조건으로도 막아 두면 실패가 아니라
    #    skip으로 끝난다.
    # ⚠️ changes 가드: 변경 0건이면 apply 를 건너뛴다. 빈 승인 클릭을 없애고, 승인 게이트가
    #    섰다는 사실 자체를 "적용할 것이 있다"는 신호로 만든다. destroy 는 항상 changes=true 다.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.plan.outputs.changes == 'true'
      && inputs.action != 'plan'
    runs-on: ubuntu-latest
    # environment: hub가 OIDC sub를 ...:environment:hub로 바꾼다(FIC의 gha-hub-environment
    # 패턴)와 required reviewers 승인 게이트, 두 가지를 동시에 한다.
    environment: hub
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: backend 설정 조립
        working-directory: ${{ env.TF_ROOT }}
        # 값의 SSOT 는 커밋된 backend.hcl.example 이다. 여기서 다시 적지 않는다 — key 가 두 곳에
        # 있으면 한쪽만 고쳤을 때 다른 root 의 state 를 덮어쓴다. git 밖 값인 Storage Account
        # 이름만 치환한다.
        # ⛔ 조립한 backend.hcl 을 출력하지 않는다. vars 는 secrets 와 달리 로그에서 마스킹되지
        #    않고, 이 저장소는 public 이라 Actions 로그가 공개된다.
        run: |
          sed 's|^storage_account_name .*|storage_account_name = "${{ vars.HUB_TF_STATE_ACCOUNT }}"|' \
            backend.hcl.example > backend.hcl
          if grep -q 'XXXXXXXX' backend.hcl; then
            echo "::error::backend.hcl 치환 실패. backend.hcl.example 의 storage_account_name 줄을 확인한다"
            exit 1
          fi

      - name: tofu init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          for i in 1 2 3; do
            tofu init -backend-config=backend.hcl && exit 0
            [ "$i" -lt 3 ] && { echo "::warning::tofu init 실패(${i}/3). 10초 후 재시도"; sleep 10; }
          done
          echo "::error::tofu init 3회 재시도 후에도 실패"
          exit 1

      - name: plan artifact 내려받기
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: tofu apply tfplan
        working-directory: ${{ env.TF_ROOT }}
        run: tofu apply -no-color -lock-timeout=5m tfplan

      # apply 직후 읽기 전용 재-plan으로 실제 수렴 여부를 종료 코드로 증명한다.
      - name: apply 후 수렴 검증 (읽기 전용 재-plan)
        working-directory: ${{ env.TF_ROOT }}
        run: |
          DESTROY=""
          [ "${{ inputs.action }}" = "destroy" ] && DESTROY="-destroy"

          set +e
          tofu plan $DESTROY -no-color -input=false -lock-timeout=5m -detailed-exitcode -refresh=true
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::error::apply 직후인데 재-plan이 여전히 변경사항을 보고한다. 일부 리소스가 반영되지 않았을 가능성이 높다. Azure 포털/CLI로 실물을 직접 대조할 것."
            exit 1
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi

      - name: apply 결과 요약
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        run: |
          {
            echo "### \`tofu apply\`: live/hub/networking"
            echo
            echo "적용한 계획: run \`${{ github.run_id }}\`의 artifact \`tfplan-${{ github.run_id }}\`"
            echo "커밋: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
